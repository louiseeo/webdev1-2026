<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        .badge {
            text-align: center;
            width: 180px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background-color: #6c63ff;
            border-radius: 50%;
            margin: 0 auto 12px;
            font-size: 50px;
        }

        .name {
            font-weight: bold;
            font-size: 1rem;
            color: #2d3436;
            margin-bottom: -7px;
        }

        .role {
            font-size: 0.75rem;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <main>
        <div class="badge">
            <div class="avatar">
                👩‍💻
            </div>
            <p class="name">Maria Santos</p>
            <p class="job">FRONTEND DEV</p>
        </div>
    </main>

</body>

</html>
