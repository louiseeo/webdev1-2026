<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <!-- 1. Evenly Spaced Row -->
        <div class="container-one">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <!-- 2. Centered Vertical Stack -->
        <div class="container-two">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <!-- 3. Bottom-Aligned Row -->
        <div class="container-three">
            <div class="box short">1</div>
            <div class="box tall">2</div>
            <div class="box medium">3</div>
        </div>

        <!-- 4. Wrapping Card Grid -->
        <div class="container-four">
            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
            <div class="card">4</div>
            <div class="card">5</div>
        </div>

        <!-- 5. Wrapped Rows, Spaced Apart -->
        <div class="container-five">
            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
            <div class="card">4</div>
        </div>

        <!-- 6. Navbar Pattern -->
        <nav class="container-six">
            <div class="logo">LOGO</div>
            <div class="links"> NAV LINKS</div>
            <button class="cta">BTN</button>
        </nav>

        <!-- 7. Reversed Order Row -->
        <div class="container-seven">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <!-- 8. Centered Column, Spaced Items -->
        <div class="container-eight">
            <div class="box small">1</div>
            <div class="box wide">2</div>
            <div class="box medium">3</div>
        </div>

        <!-- 9. Evenly Gapped Row, Left-Packed -->
        <div class="container-nine">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <!-- 10. Right-Aligned, Top-Packed Wrap -->
        <div class="container-ten">
            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
            <div class="card">4</div>
            <div class="card">5</div>
        </div>
    </main>
</body>

</html>
