<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <!-- 1. Profile Card -->
        <div class="container-one">
            <div class="profile-card">
                <div class="badge">
                    <span class="initials">JD</span>
                </div>

                <p class="name">Jane Dela Cruz</p>
                <p class="job">UI/UX Designer</p>
            </div>
        </div>

        <!-- 2. Pricing Card Row -->
        <div class="container-two">
            <div class="box">
                <span class="category">BASIC</span>
                <p class="price">₱299<span class="month">/mo</span></p>
            </div>
            <div class="box">
                <span class="category">PRO</span>
                <p class="price">₱599<span class="month">/mo</span></p>
            </div>
            <div class="box">
                <span class="category">PREMIUM</span>
                <p class="price">₱999<span class="month">/mo</span></p>
            </div>
        </div>
    </main>

</body>

</html>
