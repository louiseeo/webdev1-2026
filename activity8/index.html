<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <!-- 1. Profile Card -->
        <div class="container-one">
            <div class="profile-card">
                <div class="badge">JD</div>

                <p class="name">Jane Dela Cruz</p>
                <p class="job">UI/UX Designer</p>
            </div>
        </div>

        <!-- 2. Pricing Card Row -->
        <div class="pricing-card">
            <div class="box">
                <span class="category">BASIC</span>
                <p class="price">₱299<span class="month">/mo</span></p>
            </div>
            <div class="box">
                <span class="category">PRO</span>
                <p class="price">₱599<span class="month">/mo</span></p>
            </div>
            <div class="box">
                <span class="category">PREMIUM</span>
                <p class="price">₱999<span class="month">/mo</span></p>
            </div>
        </div>

        <!-- 3. Navigation Bar -->
        <div class="navigation-card">
            <nav class="navbar">
                <div class="logo">Brandly</div>

                <div class="nav-links">
                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#">Services</a>
                </div>

                <button class="signup-btn">Sign Up</button>
            </nav>
        </div>

        <!-- 4. Comment Block -->
        <div class="comment-card">
            <div class="avatar">MR</div>

            <div class="comment-block">
                <h3>Mark Reyes</h3>
                <p>
                    This tutorial finally made flexbox click for me.
                    The visual examples really helped — thanks!
                </p>
            </div>
        </div>

        <!-- 5. Wrapping Tag List -->
        <div class="tag-container">
            <div class="tag">HTML</div>
            <div class="tag">CSS</div>
            <div class="tag">JavaScript</div>
            <div class="tag">Flexbox</div>
            <div class="tag">Responsive Design</div>
            <div class="tag">Git</div>
        </div>
    </main>

</body>

</html>
