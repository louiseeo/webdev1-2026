<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- CHALLENGE 1.1 -->
        <div class="quote-card">
            <blockquote>
                <p>"The best way to learn CSS is to break things and rebuild them."</p>
                <cite>&mdash; A WISE DEVELOPER</cite>
            </blockquote>
        </div>

        <!-- CHALLENGE 1.2 -->
        <div class="stats">
            <div class="stat">
                <span class="num">128</span>
                <span class="label">PROJECTS</span>
            </div>
            <div class="stat">
                <span class="num">4.9★</span>
                <span class="label">RATING</span>
            </div>
            <div class="stat">
                <span class="num">99%</span>
                <span class="label">UPTIME</span>
            </div>
        </div>

        <!-- CHALLENGE 1.3 -->
        <div class="field">
            <label for="email">Email Address</label> <br>
            <input type="email" id="email" name="email" placeholder="you@example.com"> <br>
            <span class="helper">We'll never share your email.</span>
        </div>
    
    </main>
</body>
</html>
