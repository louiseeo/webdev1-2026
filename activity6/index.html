<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <!-- LEVEL 1 -->
        <div>
            <span class="ui-badge">NEW</span>
        </div>

        <!-- LEVEL 2 -->
        <div>
            <span class="ui-pill">Active User</span>
        </div>

        <!-- LEVEL 3 -->
        <div class="ui-avatar">JD</div>

        <!-- LEVEL 4 -->
        <div>
            <button class="ui-btn">Create Account</button>
        </div>

        <!-- LEVEL 5 -->
        <div class="field-group">
            <label for="email">Email Address</label>
            <input class="input-element" type="email" id="email" name="email" value="you@example.com">
        </div>

        <!-- LEVEL 6 -->
        <div class="alert-container">
            <p class="alert-message">⚠️Your storage limit is almost full.</p>
        </div>

        <!-- LEVEL 7 -->
        <div class="feature-card">
            <div class="card-icon">⚡</div>
            <h3>Fast Speed</h3>
            <p>Our edge network delivers your text content instantly.</p>
        </div>

        <!-- LEVEL 8 -->
        <div>
            <ul class="nav-menu">
                <li class="nav-link active-item" ><a href="#">Home</a></li>
                <li class="nav-link"><a href="#">Files</a></li>
                <li class="nav-link"><a href="#">Apps</a></li>
            </ul>
        </div>
    </main>
</body>

</html>
